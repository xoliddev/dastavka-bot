name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install ruff==0.17.5
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dastavka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d dastavka_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # tests/conftest.py uses this DB instead of starting its own container
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/dastavka_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t dastavka-bot:ci .
      - name: Boot self-check against compose services
        run: |
          cp .env.example .env
          sed -i 's/^BOT_TOKEN=.*/BOT_TOKEN=123456789:CI-dummy-token/' .env
          docker compose up -d --wait db redis
          docker compose run --rm bot python bot.py --check
      - if: always()
        run: docker compose down -v
